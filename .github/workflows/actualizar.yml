name: Actualizar precios

on:
  schedule:
    - cron: '30 6 * * *'   # 6:30 UTC = 6:30 Canarias en invierno, 7:30 en verano
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node generar.mjs
      - name: Publicar si hay cambios
        run: |
          git config user.name "gasolineras-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs datos
          git diff --cached --quiet && exit 0
          git commit -m "Precios $(date -u +%F)"
          git push
